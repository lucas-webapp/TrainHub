<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TrainHub</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="top-bar">
    <button type="button" id="sidebar-toggle-btn" class="icon-btn btn-ghost sidebar-toggle-btn" title="Masquer / afficher le bandeau des dossiers (Ctrl+B ou ⌘B)" aria-label="Masquer ou afficher le bandeau des dossiers" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <a class="logo" href="#" onclick="return false" title="TrainHub" aria-label="TrainHub">
        <span class="logo-mark">
            <svg class="icon" viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
                <rect x="7" y="30" width="8" height="12" rx="2.5" fill="currentColor" opacity=".55"/>
                <rect x="18" y="20" width="8" height="22" rx="2.5" fill="currentColor" opacity=".78"/>
                <rect x="29" y="12" width="8" height="30" rx="2.5" fill="currentColor"/>
                <path d="M31 19l6 6 8-8" fill="none" stroke="#e9f3ec" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="logo-text">TrainHub</span>
    </a>
    <div class="instrument-select-wrap">
        <select id="instrument-select" aria-label="Espace"></select>
        <button type="button" id="add-instrument-btn" class="icon-btn btn-ghost" title="Ajouter un espace (instrument, groupe, projet…)" aria-label="Ajouter un espace">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" id="rename-instrument-btn" class="icon-btn btn-ghost" title="Renommer / supprimer cet espace" aria-label="Renommer l'espace">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
    </div>
    <div class="auth-area" id="auth-area">
        <button type="button" id="google-signin-btn" class="btn-google" title="Se connecter avec Google pour synchroniser tes données">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.69-2.26 1.1-3.71 1.1-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.14A6.93 6.93 0 0 1 5.42 12c0-.74.13-1.46.35-2.14V7.02H2.18A10.98 10.98 0 0 0 1 12c0 1.77.42 3.45 1.18 4.98l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.02l3.66 2.84c.87-2.6 3.3-4.48 6.16-4.48z"/>
            </svg>
            <span>Se connecter</span>
        </button>
        <div id="account-info" class="account-info" hidden>
            <span id="account-name" class="account-name"></span>
            <span id="sync-status" class="sync-status" title="État de la synchronisation">●</span>
            <button type="button" id="signout-btn" class="icon-btn btn-ghost" title="Se déconnecter" aria-label="Se déconnecter">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
        </div>
    </div>
    <div class="top-actions">
        <button type="button" id="undo-btn" class="icon-btn btn-ghost" title="Annuler" aria-label="Annuler" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button type="button" id="redo-btn" class="icon-btn btn-ghost" title="Rétablir" aria-label="Rétablir" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <button type="button" id="search-toggle-btn" class="icon-btn btn-ghost" title="Rechercher un exercice (Ctrl+F : recherche rapide partout)" aria-label="Rechercher un exercice">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button type="button" id="metronome-btn" class="icon-btn btn-ghost metronome-btn-highlight" title="Métronome" aria-label="Métronome">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21 10 4h4l3 17Z"/><path d="M12 4V2.3"/><path d="M12 18 15.2 6.5"/><circle cx="14.1" cy="10.8" r="1.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" id="guided-session-btn" class="btn-ghost session-btn-highlight" title="Session guidée" aria-label="Session guidée">
            <svg class="icon" viewBox="1 2 21.5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><mask id="session-icon-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff" stroke="none"/><circle cx="15.5" cy="13.5" r="8.6" fill="#000" stroke="none"/></mask><g mask="url(#session-icon-gap)"><path d="M2 8h10"/><path d="M2 13.5h10"/><path d="M2 19h10"/></g><circle cx="15.5" cy="13.5" r="6"/><path d="M13.5 3.2h4"/><path d="M15.5 3.2v4.3"/><path d="M15.5 13.5l2.4-2.4"/></svg>
            <span>Session</span>
        </button>
        <button type="button" id="free-btn" class="btn-ghost session-btn-highlight free-btn" title="Entraînement libre : un chrono suit l'exercice affiché à l'écran principal" aria-label="Entraînement libre">
            <svg class="icon" viewBox="8.5 2 14 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.5" cy="13.5" r="6"/><path d="M13.5 3.2h4"/><path d="M15.5 3.2v4.3"/><path d="M15.5 13.5l2.4-2.4"/></svg>
            <span>Libre</span>
        </button>
        <button type="button" id="aides-btn" class="icon-btn btn-ghost" title="Aides (cercle des quintes…)" aria-label="Aides">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="2.6" x2="12" y2="4.6"/><line x1="17.2" y1="4.8" x2="15.9" y2="6.4"/><line x1="21.4" y1="12" x2="19.4" y2="12"/><line x1="17.2" y1="19.2" x2="15.9" y2="17.6"/><line x1="12" y1="21.4" x2="12" y2="19.4"/><line x1="6.8" y1="19.2" x2="8.1" y2="17.6"/><line x1="2.6" y1="12" x2="4.6" y2="12"/><line x1="6.8" y1="4.8" x2="8.1" y2="6.4"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" id="scales-btn" class="icon-btn btn-ghost" title="Gammes &amp; arpèges" aria-label="Gammes et arpèges">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="4" x2="3" y2="20"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="13" y1="4" x2="13" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/><circle cx="8" cy="7" r="1.6" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="17" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" id="tuner-btn" class="icon-btn btn-ghost" title="Accordeur (micro ou carte son)" aria-label="Accordeur">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3c0 3-2 4-2 7.5a6 6 0 0 0 12 0C18 7 16 6 16 3"/><line x1="12" y1="14.5" x2="12" y2="20"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg>
        </button>
        <button type="button" id="backups-btn" class="icon-btn btn-ghost" title="Sauvegardes de secours" aria-label="Sauvegardes de secours">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
        </button>
        <button type="button" id="trash-btn" class="icon-btn btn-ghost" title="Corbeille" aria-label="Corbeille">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
        <button type="button" id="export-btn" class="icon-btn btn-ghost" title="Exporter (sauvegarde JSON)" aria-label="Exporter">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 12-4-4m4 4 4-4"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button type="button" id="import-btn" class="icon-btn btn-ghost" title="Importer une sauvegarde JSON" aria-label="Importer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4-4 4"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <input type="file" id="import-input" accept="application/json" hidden>
        <button type="button" id="settings-btn" class="icon-btn btn-ghost" title="Paramètres" aria-label="Paramètres">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
    </div>
</div>

<div class="chapter-bar" id="chapter-bar"></div>

<div class="layout">
    <aside class="sidebar-tree" id="sidebar-tree" aria-label="Chapitres et dossiers"></aside>
    <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Largeur du bandeau" title="Glisser pour élargir ou rétrécir le bandeau (double-clic : taille par défaut)"></div>
    <div class="main">
        <div class="search-row" id="search-row" hidden>
            <input type="search" id="search-input" placeholder="Rechercher un exercice (tous les dossiers actifs)…" aria-label="Rechercher un exercice">
            <button type="button" id="quickfind-btn" class="btn-ghost search-quick-btn" title="Recherche rapide : exercices, sessions et dossiers de tous les espaces (Ctrl+F)">Recherche rapide</button>
            <button type="button" id="search-close-btn" class="icon-btn btn-ghost" title="Fermer la recherche" aria-label="Fermer la recherche">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-heading" id="content-heading"></div>
        <div id="folder-container"></div>
        <div id="empty-state" class="empty-state" hidden>Aucun exercice ici pour l'instant.</div>
    </div>
    <aside class="metro-dock" id="metro-dock" aria-label="Métronome" hidden></aside>
</div>

<script src="script.js"></script>
</body>
</html>
