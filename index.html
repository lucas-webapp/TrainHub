<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TrainHub</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<script>(function(){try{var t=localStorage.getItem("trainhub.theme.v1"),l=t==="light"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.setAttribute("data-theme",l?"light":"dark");if(localStorage.getItem("trainhub.glass.v1")==="1")document.documentElement.setAttribute("data-glass","1");document.documentElement.setAttribute("data-glass-bg",localStorage.getItem("trainhub.glassBg.v1")||"aurora");document.documentElement.setAttribute("data-halo",localStorage.getItem("trainhub.halo.v1")||"diffuse");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",l?"#f1f4f1":"#0a0a0a")}catch(e){}})()</script>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="top-bar">
    <button type="button" id="sidebar-toggle-btn" class="icon-btn btn-ghost sidebar-toggle-btn" title="Masquer / afficher le bandeau des dossiers (Ctrl+B ou ⌘B)" aria-label="Masquer ou afficher le bandeau des dossiers" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <a class="logo" href="#" onclick="return false" title="TrainHub" aria-label="TrainHub">
        <span class="logo-mark">
            <svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><defs></defs><rect width="64" height="64" rx="14" fill="#0b110d"/><rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="currentColor" stroke-opacity=".22"/><rect x="6" y="43" width="8" height="11" rx="2.5" fill="currentColor" fill-opacity="0.4"/><rect x="16.5" y="33" width="8" height="21" rx="2.5" fill="currentColor" fill-opacity="0.62"/><rect x="27" y="23" width="8" height="31" rx="2.5" fill="currentColor" fill-opacity="0.82"/><path d="M38.00 54.00L43.00 14.00L51.00 14.00L56.00 54.00Z" fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/><path d="M52.20 14.00L53.00 8.50" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" fill="none"/><path d="M47.00 50.00L52.20 14.00" stroke="#0b110d" stroke-width="3.3" stroke-linecap="round" fill="none"/><path d="M49.10 35.48L49.94 29.66" stroke="#0b110d" stroke-width="5.4" stroke-linecap="round" fill="none"/></svg>
        </span>
        <span class="logo-text">TrainHub</span>
    </a>
    <div class="instrument-select-wrap">
        <select id="instrument-select" aria-label="Espace"></select>
        <button type="button" id="add-instrument-btn" class="icon-btn btn-ghost" title="Ajouter un espace (instrument, groupe, projet…)" aria-label="Ajouter un espace">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" id="rename-instrument-btn" class="icon-btn btn-ghost" title="Renommer / supprimer cet espace" aria-label="Renommer l'espace">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
    </div>
    <div class="auth-area" id="auth-area">
        <!-- Pilule de connexion, menu du compte et fenêtre de connexion : dessinés par compte-cloud.js (composant commun HarmoHub / TabHub / TrainHub). -->
        <div id="compte-cloud"></div>
    </div>
    <div id="top-clock" class="top-clock" role="timer" aria-live="off" title="Heure actuelle" aria-label="Heure actuelle">
        <svg class="top-clock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.6 2.2"/></svg>
        <span class="top-clock-text"><span class="top-clock-time"></span><span class="top-clock-date"></span></span>
    </div>
    <div class="top-actions">
        <button type="button" id="undo-btn" class="icon-btn btn-ghost phone-hide" title="Annuler" aria-label="Annuler" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button type="button" id="redo-btn" class="icon-btn btn-ghost phone-hide" title="Rétablir" aria-label="Rétablir" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <button type="button" id="search-toggle-btn" class="icon-btn btn-ghost" title="Rechercher un exercice (Ctrl+F : recherche rapide partout)" aria-label="Rechercher un exercice">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button type="button" id="more-btn" class="icon-btn btn-ghost phone-only" title="Annuler, rétablir, corbeille" aria-label="Plus d'actions" aria-haspopup="menu">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="0.9"/><circle cx="12" cy="12" r="0.9"/><circle cx="19" cy="12" r="0.9"/></svg>
        </button>
        <button type="button" id="theory-btn" class="icon-btn btn-ghost phone-only" title="Gammes, harmonie, aides, accordeur" aria-label="Outils de musique" aria-haspopup="menu">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
        </button>
        <button type="button" id="guided-session-btn" class="btn-ghost session-btn-highlight" title="Session guidée" aria-label="Session guidée">
            <svg class="icon" viewBox="1 2 21.5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><mask id="session-icon-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff" stroke="none"/><circle cx="15.5" cy="13.5" r="8.6" fill="#000" stroke="none"/></mask><g mask="url(#session-icon-gap)"><path d="M2 8h10"/><path d="M2 13.5h10"/><path d="M2 19h10"/></g><circle cx="15.5" cy="13.5" r="6"/><path d="M13.5 3.2h4"/><path d="M15.5 3.2v4.3"/><path d="M15.5 13.5l2.4-2.4"/></svg>
            <span>Session</span>
        </button>
        <button type="button" id="free-btn" class="btn-ghost session-btn-highlight free-btn" title="Entraînement libre : un chrono suit l'exercice affiché à l'écran principal" aria-label="Entraînement libre">
            <svg class="icon" viewBox="8.5 2 14 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.5" cy="13.5" r="6"/><path d="M13.5 3.2h4"/><path d="M15.5 3.2v4.3"/><path d="M15.5 13.5l2.4-2.4"/></svg>
            <span>Libre</span>
        </button>
        <span class="top-break" aria-hidden="true"></span>
        <button type="button" id="metronome-btn" class="icon-btn btn-ghost metronome-btn-highlight" title="Métronome" aria-label="Métronome">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 2.6h2.8l4.1 18.8H6.5Z"/><path d="M7.7 17h8.6"/><path d="M12.1 13.8 18.7 6.2"/></svg>
        </button>
        <button type="button" id="aides-btn" class="icon-btn btn-ghost phone-hide" title="Aides (cercle des quintes…)" aria-label="Aides">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.4"/><circle cx="12" cy="12" r="4.4"/><path stroke-width="1.5" d="M13.68 7.93L15.60 3.32M16.07 10.32L20.68 8.40M16.07 13.68L20.68 15.60M13.68 16.07L15.60 20.68M10.32 16.07L8.40 20.68M7.93 13.68L3.32 15.60M7.93 10.32L3.32 8.40M10.32 7.93L8.40 3.32"/></svg>
        </button>
        <button type="button" id="scales-btn" class="icon-btn btn-ghost phone-hide" title="Gammes &amp; arpèges" aria-label="Gammes et arpèges">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="4" x2="3" y2="20"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="13" y1="4" x2="13" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/><circle cx="8" cy="7" r="1.6" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="17" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" id="harmony-btn" class="icon-btn btn-ghost phone-hide" title="Harmonie (degrés et accords d'une gamme)" aria-label="Harmonie">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M3 10h18M3 15h18M3 20h18" stroke-width="1.2" opacity=".55"/><ellipse cx="9" cy="17.5" rx="2.6" ry="2" fill="currentColor" stroke="none"/><ellipse cx="9" cy="12.5" rx="2.6" ry="2" fill="currentColor" stroke="none"/><ellipse cx="9" cy="7.5" rx="2.6" ry="2" fill="currentColor" stroke="none"/><path d="M11.6 17.5V4"/></svg>
        </button>
        <button type="button" id="tuner-btn" class="icon-btn btn-ghost phone-hide" title="Accordeur (micro ou carte son)" aria-label="Accordeur">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3v7a3.5 3.5 0 0 0 7 0V3"/><line x1="12" y1="13.5" x2="12" y2="20"/><line x1="9.5" y1="21" x2="14.5" y2="21"/></svg>
        </button>
        <button type="button" id="rec-btn" class="icon-btn btn-ghost" title="Enregistreur rapide (micro ou carte son, métronome en fond, rangé dans un exercice)" aria-label="Enregistreur rapide">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="2.5" width="6" height="11" rx="3"/><path d="M4.5 11a7 7 0 0 0 13 3.6"/><path d="M11.5 18v3.5"/><path d="M8.5 21.5h6"/><circle cx="19" cy="5.5" r="2.3" fill="#ff5252" stroke="none"/></svg>
        </button>
        <button type="button" id="audio-btn" class="icon-btn btn-ghost" title="Lecteur audio et liste de lecture" aria-label="Lecteur audio">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 14v4a2 2 0 0 1-2 2h-1v-6h3"/><path d="M3 14v4a2 2 0 0 0 2 2h1v-6H3"/></svg>
        </button>
        <button type="button" id="trash-btn" class="icon-btn btn-ghost phone-hide" title="Corbeille" aria-label="Corbeille">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
        <input type="file" id="import-input" accept="application/json" hidden>
        <button type="button" id="settings-btn" class="icon-btn btn-ghost" title="Paramètres" aria-label="Paramètres">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
    </div>
</div>

<div class="chapter-bar" id="chapter-bar"></div>

<div class="layout">
    <aside class="sidebar-tree" id="sidebar-tree" aria-label="Chapitres et dossiers"></aside>
    <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Largeur du bandeau" title="Glisser pour élargir ou rétrécir le bandeau (double-clic : taille par défaut)"></div>
    <div class="main">
        <div class="search-row" id="search-row" hidden>
            <input type="search" id="search-input" placeholder="Rechercher un exercice (tous les dossiers actifs)…" aria-label="Rechercher un exercice">
            <button type="button" id="quickfind-btn" class="btn-ghost search-quick-btn" title="Recherche rapide : exercices, sessions et dossiers de tous les espaces (Ctrl+F)">Recherche rapide</button>
            <button type="button" id="search-close-btn" class="icon-btn btn-ghost" title="Fermer la recherche" aria-label="Fermer la recherche">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-heading" id="content-heading"></div>
        <div id="folder-container"></div>
        <div id="empty-state" class="empty-state" hidden>Aucun exercice ici pour l'instant.</div>
    </div>
    <aside class="metro-dock" id="metro-dock" aria-label="Métronome" hidden></aside>
</div>

<script src="compte-cloud.js"></script>
<script src="script.js"></script>
</body>
</html>
