<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TrainHub</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="top-bar">
    <a class="logo" href="#" onclick="return false" title="TrainHub" aria-label="TrainHub">
        <span class="logo-mark">
            <svg class="icon" viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
                <rect x="7" y="30" width="8" height="12" rx="2.5" fill="currentColor" opacity=".55"/>
                <rect x="18" y="20" width="8" height="22" rx="2.5" fill="currentColor" opacity=".78"/>
                <rect x="29" y="12" width="8" height="30" rx="2.5" fill="currentColor"/>
                <path d="M31 19l6 6 8-8" fill="none" stroke="#e9f3ec" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="logo-text">TrainHub</span>
    </a>
    <div class="instrument-select-wrap">
        <select id="instrument-select" aria-label="Instrument"></select>
        <button type="button" id="rename-instrument-btn" class="icon-btn btn-ghost" title="Renommer / supprimer l'instrument" aria-label="Renommer l'instrument">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
    </div>
    <div class="auth-area" id="auth-area">
        <button type="button" id="google-signin-btn" class="btn-google" title="Se connecter avec Google pour synchroniser tes données">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.69-2.26 1.1-3.71 1.1-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.14A6.93 6.93 0 0 1 5.42 12c0-.74.13-1.46.35-2.14V7.02H2.18A10.98 10.98 0 0 0 1 12c0 1.77.42 3.45 1.18 4.98l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.02l3.66 2.84c.87-2.6 3.3-4.48 6.16-4.48z"/>
            </svg>
            <span>Se connecter</span>
        </button>
        <div id="account-info" class="account-info" hidden>
            <span id="account-name" class="account-name"></span>
            <span id="sync-status" class="sync-status" title="État de la synchronisation">●</span>
            <button type="button" id="signout-btn" class="icon-btn btn-ghost" title="Se déconnecter" aria-label="Se déconnecter">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
        </div>
    </div>
    <div class="top-actions">
        <button type="button" id="add-instrument-btn" class="icon-btn btn-ghost" title="Ajouter un instrument" aria-label="Ajouter un instrument">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" id="toggle-a-revoir-btn" title="Afficher seulement les exercices à revoir">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20l-1.4-1.3C6 14.6 3 11.9 3 8.6 3 5.9 5.1 4 7.7 4c1.5 0 2.9.7 3.8 1.9.9-1.2 2.3-1.9 3.8-1.9C17.9 4 20 5.9 20 8.6c0 3.3-3 6-8.6 10.1Z"/></svg>
            <span>À revoir</span>
        </button>
        <button type="button" id="toggle-updated-at-btn" class="icon-btn btn-ghost" title="Afficher/masquer les dates de modification" aria-label="Afficher/masquer les dates de modification">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </button>
        <button type="button" id="export-btn" class="icon-btn btn-ghost" title="Exporter (sauvegarde JSON)" aria-label="Exporter">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 12-4-4m4 4 4-4"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button type="button" id="import-btn" class="icon-btn btn-ghost" title="Importer une sauvegarde JSON" aria-label="Importer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4-4 4"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <input type="file" id="import-input" accept="application/json" hidden>
    </div>
</div>

<div class="chapter-bar" id="chapter-bar"></div>

<div class="layout">
    <aside class="sidebar-tree" id="sidebar-tree" aria-label="Chapitres et dossiers"></aside>
    <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Largeur du bandeau" title="Glisser pour élargir ou rétrécir le bandeau (double-clic : taille par défaut)"></div>
    <div class="main">
        <div class="search-row">
            <input type="search" id="search-input" placeholder="Rechercher un exercice (tous les dossiers)…" aria-label="Rechercher un exercice">
        </div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-heading" id="content-heading"></div>
        <div id="folder-container"></div>
        <div id="empty-state" class="empty-state" hidden>Aucun exercice ici pour l'instant.</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
